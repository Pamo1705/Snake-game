<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Neon Snake</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#090d12;--panel:#101820;--line:#1d2b34;--muted:#82939d;--green:#a3ff5f;--green2:#58d68d;--red:#ff647c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#14251f 0%,#090d12 48%);color:#eef7f1;font-family:'Space Grotesk',sans-serif;display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,560px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid #33533a;background:#14251a;border-radius:13px;display:grid;place-items:center;color:var(--green);font-size:22px;box-shadow:0 0 24px #a3ff5f18}h1{font-size:22px;letter-spacing:-.7px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.pill{font:11px 'DM Mono',monospace;color:var(--green);border:1px solid #35563a;border-radius:99px;padding:7px 10px;letter-spacing:1px}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:#101820cc;border:1px solid var(--line);border-radius:14px;padding:12px 15px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.4px}.stat strong{display:block;font:21px 'DM Mono',monospace;margin-top:5px}.stat strong.green{color:var(--green)}
    .board-wrap{position:relative;padding:10px;background:linear-gradient(145deg,#17252b,#0c1319);border:1px solid #263740;border-radius:20px;box-shadow:0 24px 70px #0008, inset 0 1px #ffffff08}.board{display:block;width:100%;aspect-ratio:1;background:#080e13;border-radius:12px;touch-action:none}
    .overlay{position:absolute;inset:10px;display:grid;place-items:center;background:#050a0dcc;border-radius:12px;text-align:center;padding:24px}.overlay.hidden{display:none}.modal h2{font-size:26px;margin:0 0 8px}.modal p{color:#9eafb7;font-size:14px;margin:0 0 20px;line-height:1.5}.primary{background:var(--green);color:#10170d;border:0;border-radius:11px;padding:12px 22px;font:700 14px 'Space Grotesk';cursor:pointer;box-shadow:0 0 26px #a3ff5f2b}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .controls{display:flex;gap:10px;margin-top:14px}.controls button,.dpad button{background:#111b22;color:#e6f0e9;border:1px solid #263740;border-radius:11px;padding:11px 14px;font:600 13px 'Space Grotesk';cursor:pointer}.controls button:hover,.dpad button:hover{border-color:#6a9b58;color:var(--green)}.controls .grow{flex:1}
    .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#71838d;font-size:11px}.keys{font-family:'DM Mono',monospace;color:#a5b4b9}.dpad{display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;margin:16px auto 0}.dpad button{padding:0;font-size:17px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
    @media(max-width:520px){body{padding:16px}.dpad{display:grid}.bottom{font-size:10px}.pill{font-size:9px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="logo">蛇</div><div><h1>NEON SNAKE</h1><div class="sub">Classic arcade · Dark edition</div></div></div><div class="pill">● SYSTEM ONLINE</div></header>
    <section class="stats">
      <div class="stat"><span>Score</span><strong class="green" id="score">000</strong></div>
      <div class="stat"><span>Best</span><strong id="best">000</strong></div>
      <div class="stat"><span>Speed</span><strong id="speed">01</strong></div>
    </section>
    <div class="board-wrap">
      <canvas class="board" id="game" width="480" height="480" aria-label="Snake Spielfeld"></canvas>
      <div class="overlay" id="overlay"><div class="modal"><h2 id="headline">Ready to play?</h2><p id="message">Sammle die Energie-Orbs. Je länger du wirst,<br> desto schneller wird das Spiel.</p><button class="primary" id="start">Spiel starten&nbsp; →</button></div></div>
    </div>
    <div class="controls"><button class="grow" id="pause">Ⅱ &nbsp;Pause</button><button id="restart">↻ &nbsp;Neustart</button></div>
    <div class="dpad" aria-label="Touch-Steuerung"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
    <div class="bottom"><span>MOVE <span class="keys">W A S D</span> / <span class="keys">← ↑ ↓ →</span></span><span>DON'T HIT THE WALLS</span></div>
  </main>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed');
  const SIZE=24,CELL=20;let snake,food,dir,nextDir,score,best=Number(localStorage.getItem('neonSnakeBest')||0),running=false,paused=false,over=true,timer=null,tick=145;
  bestEl.textContent=String(best).padStart(3,'0');
  function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;tick=145;placeFood();updateStats();draw()}
  function placeFood(){do{food={x:Math.floor(Math.random()*SIZE),y:Math.floor(Math.random()*SIZE)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
  function updateStats(){scoreEl.textContent=String(score).padStart(3,'0');bestEl.textContent=String(best).padStart(3,'0');speedEl.textContent=String(Math.max(1,Math.floor((160-tick)/12)+1)).padStart(2,'0')}
  function draw(){
    ctx.fillStyle='#080e13';ctx.fillRect(0,0,480,480);
    ctx.strokeStyle='#142129';ctx.lineWidth=1;for(let i=0;i<=SIZE;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(480,i*CELL);ctx.stroke()}
    const fx=(food.x+.5)*CELL,fy=(food.y+.5)*CELL;ctx.shadowColor='#ff647c';ctx.shadowBlur=18;ctx.fillStyle='#ff647c';ctx.beginPath();ctx.arc(fx,fy,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd1d8';ctx.beginPath();ctx.arc(fx-2,fy-2,2,0,Math.PI*2);ctx.fill();
    snake.forEach((p,i)=>{const pad=i===0?2:2.5;ctx.shadowColor='#83f34f';ctx.shadowBlur=i===0?17:8;ctx.fillStyle=i===0?'#c0ff83':i<3?'#a3ff5f':'#65c94b';roundRect(ctx,p.x*CELL+pad,p.y*CELL+pad,CELL-pad*2,CELL-pad*2,5);ctx.fill();if(i===0){ctx.shadowBlur=0;ctx.fillStyle='#19301b';const ex=p.x*CELL+(dir.x===1?14:dir.x===-1?5:dir.x===0?6:14),ey=p.y*CELL+(dir.y===1?14:dir.y===-1?5:dir.y===0?6:14);ctx.beginPath();ctx.arc(ex,ey,1.7,0,7);ctx.arc(ex+(dir.y===0?0:5),ey+(dir.x===0?0:5),1.7,0,7);ctx.fill()}});ctx.shadowBlur=0;
  }
  function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
  function step(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=SIZE||head.y>=SIZE||snake.some((p,i)=>i<snake.length-1&&p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;if(score>best){best=score;localStorage.setItem('neonSnakeBest',best)}tick=Math.max(65,145-Math.floor(score/30)*8);placeFood();updateStats()}else snake.pop();draw()}
  function start(){if(running)return;reset();running=true;paused=false;over=false;overlay.classList.add('hidden');clearInterval(timer);timer=setInterval(step,tick)}
  function endGame(){running=false;over=true;clearInterval(timer);document.getElementById('headline').textContent='Game over';document.getElementById('message').innerHTML='Score: <b style="color:#a3ff5f">'+score+'</b> · Versuch es gleich nochmal!';document.getElementById('start').textContent='Nochmal spielen  →';overlay.classList.remove('hidden')}
  function pause(){if(over)return;if(paused){paused=false;running=true;timer=setInterval(step,tick);document.getElementById('pause').textContent='Ⅱ  Pause';overlay.classList.add('hidden')}else{paused=true;running=false;clearInterval(timer);document.getElementById('headline').textContent='Paused';document.getElementById('message').textContent='Kurze Verschnaufpause?';document.getElementById('start').textContent='Weiter spielen  →';overlay.classList.remove('hidden');document.getElementById('pause').textContent='▶  Weiter'}}
  function setDir(d){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const n=dirs[d];if(n&&!(n.x===-dir.x&&n.y===-dir.y))nextDir=n}
  document.getElementById('start').addEventListener('click',()=>{if(paused){pause();return}start();document.getElementById('start').textContent='Spiel starten  →'});
  document.getElementById('pause').addEventListener('click',pause);document.getElementById('restart').addEventListener('click',()=>{clearInterval(timer);running=false;paused=false;over=true;reset();document.getElementById('headline').textContent='Ready to play?';document.getElementById('message').innerHTML='Sammle die Energie-Orbs. Je länger du wirst,<br> desto schneller wird das Spiel.';document.getElementById('start').textContent='Spiel starten  →';overlay.classList.remove('hidden')});
  document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}if(e.code==='Space'){e.preventDefault();if(over)start();else pause()}});
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));
  reset();
})();
</script>
</body></html>
